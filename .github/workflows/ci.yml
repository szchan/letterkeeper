name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash .github/ci/setup-linux.sh
      - run: bash .github/ci/toolchain.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ubuntu24-rust1.99-${{ hashFiles('Cargo.lock') }}
      - name: CI orchestration tests
        run: python3 tests/ci/test_ci.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --locked --workspace
      - name: Build application
        run: cargo build --locked --workspace
      - name: Actual terminal navigation, Chinese and widths
        run: python3 tests/e2e/verify_terminal.py target/debug/letterkeeper
      - name: Full edit, review, approval and submission workspace
        run: python3 tests/e2e/verify_workspace.py target/debug/letterkeeper
      - name: Reachable HTTP/DNS observer privacy checks
        run: python3 tests/e2e/verify_privacy_workspace.py target/debug/letterkeeper
  codex-client:
    name: codex-client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash .github/ci/setup-linux.sh
      - run: bash .github/ci/toolchain.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ubuntu24-rust1.99-${{ hashFiles('Cargo.lock') }}
      - name: Bounded Codex MCP readiness orchestration tests
        run: python3 tests/ci/test_codex_readiness.py
      - run: cargo build --locked --workspace
      - run: bash .github/ci/install-codex.sh
      - name: Public Codex app-server, synthetic MCP, no auth or model turn
        run: python3 tests/e2e/verify_codex.py target/debug/letterkeeper --codex "$RUNNER_TEMP/letterkeeper-codex/codex-x86_64-unknown-linux-musl"
  ci-gate:
    name: ci-gate
    needs: [workspace, codex-client]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to succeed
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          CODEX_RESULT: ${{ needs.codex-client.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$CODEX_RESULT" = success
