# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "letterkeeper-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
thiserror.workspace = true
# async-imap TRACE logs include credential bytes; compile them out in all profiles.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }

[dev-dependencies]
rcgen = "0.14"
