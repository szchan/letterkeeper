# SPDX-License-Identifier: GPL-3.0-only
name: Developer tools
on:
  push:
    paths: ['tools/**', 'tests/tools/**', 'tests/e2e/verify_gitnexus.py', '.github/workflows/developer-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
# Keep failed RED runs as immutable evidence.
jobs:
  source-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exact revision and raw test result
        run: |
          git rev-parse HEAD
          python3 tests/tools/test_gitnexus.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - name: Install pinned prebuilt graph tool (no compilation)
        run: python3 tools/gitnexus.py install
      - name: Index this exact source revision
        run: python3 tools/gitnexus.py index
      - name: Actual stdio MCP and loopback graph browser
        run: python3 tests/e2e/verify_gitnexus.py
