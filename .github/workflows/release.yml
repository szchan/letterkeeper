# SPDX-License-Identifier: GPL-3.0-only
name: Release and performance sample
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  release-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/setup-linux.sh
      - run: bash scripts/ci/toolchain.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ubuntu24-rust1.99-${{ hashFiles('Cargo.lock') }}
      - name: Release workspace tests, build and synthetic performance workload
        run: python3 scripts/ci/release.py
      - name: Binary, corresponding source, license and synthetic measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: letterkeeper-linux-x86_64-${{ github.sha }}
          path: target/ci-release/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
